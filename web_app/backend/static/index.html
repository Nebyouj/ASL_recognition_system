<!DOCTYPE html>
<html>
<head>
    <title>ASL Recognition System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .video-wrapper {
            position: relative;
        }

        video {
            width: 640px;
            max-width: 100%;
            border-radius: 15px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transform: scaleX(-1);
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: lime;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.5); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        .sentence-box {
            margin-top: 25px;
            width: 100%;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            min-height: 80px;
        }

        .sentence-box h2 {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        #sentence {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            word-wrap: break-word;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #00c6ff;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
            color: white;
        }

        @media (max-width: 600px) {
            video {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>American Sign Language Recognition</h1>

    <div class="video-wrapper">
        <video id="video" autoplay></video>
    </div>

    <div class="status">
        <span class="pulse"></span> Listening for signs...
    </div>

    <div class="sentence-box">
        <h2>Recognized Sentence</h2>
        <p id="sentence"></p>
    </div>

    <div class="controls">
        <button onclick="clearSentence()">Clear Sentence</button>
    </div>

    <audio id="audio" autoplay></audio>
</div>

<script>
const video = document.getElementById("video");
const sentenceText = document.getElementById("sentence");
const audio = document.getElementById("audio");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream);

let isProcessing = false;

async function sendFrame() {
    if (isProcessing) return;
    isProcessing = true;

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg"));

    const formData = new FormData();
    formData.append("frame", blob);

    try {
        const res = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        sentenceText.innerText = data.sentence || "";

        if (data.word && data.word !== "") {
            audio.src = `/tts?sentence=${encodeURIComponent(data.word)}`;
        }

    } catch (err) {
        console.error(err);
    }

    isProcessing = false;
}

setInterval(sendFrame, 120);

function clearSentence() {
    sentenceText.innerText = "";
}
</script>

</body>
</html>
